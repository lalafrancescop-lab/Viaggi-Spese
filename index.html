];

function buildMultiLineSVG(series, years){
  var w = 720, h = 240, padL = 52, padR = 16, padT = 16, padB = 30;
  var innerW = w - padL - padR, innerH = h - padT - padB;
  var allVals = [];
  series.forEach(function(s){ s.values.forEach(function(v){ if (v!=null) allVals.push(v); }); });
  var maxVal = Math.max.apply(null, allVals.concat([1]));
  var n = years.length;
  function x(i){ return n<=1 ? padL + innerW/2 : padL + (innerW * i/(n-1)); }
  function y(v){ return padT + innerH - (innerH * (v/maxVal)); }
  var gridLines = '', gridLabels = '';
  for (var g=0; g<=3; g++){
    var val = maxVal * g/3, yy = y(val);
    gridLines += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w-padR) + '" y2="' + yy + '" stroke="#E7E1D2" stroke-width="1"/>';
    gridLabels += '<text x="' + (padL-8) + '" y="' + (yy+3) + '" font-size="10" fill="#6B6558" text-anchor="end" font-family="JetBrains Mono, monospace">' + Math.round(val) + '</text>';
  }
  var xLabels = years.map(function(yr,i){
    return '<text x="' + x(i) + '" y="' + (h-8) + '" font-size="11" fill="#6B6558" text-anchor="middle" font-family="JetBrains Mono, monospace">' + yr + '</text>';
  }).join('');
  var anyProvisional = false;
  var lines = series.map(function(s){
    var pts = s.values.map(function(v,i){ return v==null ? null : x(i)+','+y(v); }).filter(Boolean).join(' ');
    var dash = s.dash ? ' stroke-dasharray="' + s.dash + '"' : '';
    // un punto "provvisorio" (es. Costo Reale con contanti da riconciliare, o dati storici
    // incompleti) è un anello vuoto invece di un pallino pieno: resta nel grafico ma non
    // sembra un dato certo quanto gli altri.
    var dots = s.values.map(function(v,i){
      if (v==null) return '';
      var isProv = s.provisional && s.provisional[i];
      if (isProv){ anyProvisional = true; return '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>'; }
      return '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="'+s.color+'"/>';
    }).join('');
    return '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2.5"' + dash + '/>' + dots;
  }).join('');
  var legend = series.map(function(s,i){
    return '<span style="display:inline-flex; align-items:center; gap:5px; margin-right:14px;"><span style="width:10px; height:10px; border-radius:50%; background:' + s.color + '; display:inline-block;"></span>' + s.label + '</span>';
  }).join('') + (anyProvisional ? '<span style="display:inline-flex; align-items:center; gap:5px; margin-right:14px;"><span style="width:9px; height:9px; border-radius:50%; background:#fff; border:2px solid #6B6558; display:inline-block;"></span>dato provvisorio</span>' : '');
  return '<div class="card-sub" style="margin-bottom:8px;">' + legend + '</div>' +
    '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:100%; height:auto;">' + gridLines + gridLabels + lines + xLabels + '</svg>';
}

function buildBarCompareSVG(items){ // [{label, value, color, provisional}]
  var w = 720, barH = 26, gap = 10, padL = 130, padR = 70, padT = 10;
  var maxVal = Math.max.apply(null, items.map(function(i){ return i.value||0; }).concat([1]));
  var h = padT*2 + items.length*(barH+gap);
  var innerW = w - padL - padR;
  var rows = items.map(function(it,i){
    var y = padT + i*(barH+gap);
    var bw = maxVal ? (it.value/maxVal*innerW) : 0;
    var barStyle = it.provisional ? ('fill="none" stroke="' + it.color + '" stroke-width="2" stroke-dasharray="4,3"') : ('fill="' + it.color + '"');
    return (
      '<text x="' + (padL-8) + '" y="' + (y+barH*0.65) + '" font-size="11.5" fill="#22272B" text-anchor="end" font-family="Inter, sans-serif">' + escapeHtml(it.label) + '</text>' +
      '<rect x="' + padL + '" y="' + y + '" width="' + bw.toFixed(1) + '" height="' + barH + '" rx="4" ' + barStyle + '/>' +
      '<text x="' + (padL+bw+8) + '" y="' + (y+barH*0.65) + '" font-size="11.5" fill="#6B6558" font-family="JetBrains Mono, monospace">' + fmtEUR(it.value) + (it.provisional?' (provv.)':'') + '</text>'
    );
  }).join('');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:100%; height:auto;">' + rows + '</svg>';
}

// Aggrega un budget (Replicabile o Essenziale) su più viaggi rispettando lo stato "known":
// un viaggio con quel budget sconosciuto NON contribuisce alla somma come se fosse zero.
// Aggrega un budget (Replicabile o Essenziale) su più viaggi rispettando due livelli distinti:
// "known" (il valore è calcolabile, anche se solo in parte affidabile) e "definitivo" (calcolabile
// E non provvisorio per quel viaggio: nessuna spesa da classificare residua, nessun contante da
// riconciliare, dati storici completi). Un viaggio con budget noto ma provvisorio NON deve mai
// far apparire l'aggregato come "completo".
function aggregateKnownBudget(rows, valueKey, knownKey){
  var sum = 0, knownCount = 0, definitiveCount = 0, realSumForKnown = 0;
  rows.forEach(function(r){
    if (r[knownKey]){
      sum += r[valueKey]; knownCount++; realSumForKnown += r.real;
      if (!r.isProvisional && !r.incompleteData) definitiveCount++;
    }
  });
  return { sum: sum, knownCount: knownCount, definitiveCount: definitiveCount, totalCount: rows.length, realSumForKnown: realSumForKnown };
}
// Stati possibili, dal più al meno affidabile: nd (nessun viaggio noto) -> parziale (alcuni
// viaggi non hanno nemmeno un valore calcolabile) -> provvisorio (tutti i viaggi contribuiscono
// con un numero, ma non tutti sono definitivi) -> completo (tutti noti E tutti definitivi).
function aggregateStatusLabel(agg){
  if (agg.knownCount === 0) return 'nd';
  if (agg.knownCount < agg.totalCount) return 'parziale';
  if (agg.definitiveCount < agg.knownCount) return 'provvisorio';
  return 'completo';
}
function renderAggregateKpiValue(label, agg){
  var status = aggregateStatusLabel(agg);
  if (status === 'nd'){
    return '<div class="kpi"><div class="kpi-label">' + label + '</div><div class="kpi-value" style="color:var(--text-muted); font-size:19px;">N/D</div><div class="kpi-sub">nessun viaggio ha ancora dati classificati a sufficienza</div></div>';
  }
  var tagColor = status === 'provvisorio' ? 'var(--gold-ink)' : (status === 'parziale' ? 'var(--gold-ink)' : '');
  var tag = status !== 'completo' ? ' <span style="font-size:10px; font-weight:700; color:' + tagColor + ';">' + status.toUpperCase() + '</span>' : '';
  var sub;
  if (status === 'parziale') sub = 'Parziale — ' + agg.knownCount + ' viaggi su ' + agg.totalCount + ' classificati. Non rappresenta l\'intero storico.';
  else if (status === 'provvisorio') sub = 'Provvisorio — ' + agg.definitiveCount + ' viaggi definitivi, ' + (agg.knownCount - agg.definitiveCount) + ' ancora da completare (classificazione, contanti o dati storici).';
  else sub = 'somma su tutti i ' + agg.totalCount + ' viaggi, tutti definitivi';
  return '<div class="kpi"><div class="kpi-label">' + label + tag + '</div><div class="kpi-value">' + fmtEUR(agg.sum) + '</div><div class="kpi-sub">' + sub + '</div></div>';
}

// Stato del Costo Reale totale: qui il valore è SEMPRE numericamente noto per ogni viaggio
// (è la somma di ciò che è stato registrato), quindi i soli stati possibili sono
// "completo" (nessun viaggio provvisorio/incompleto) o "provvisorio".
function realAggregateStatus(rows){
  var definitiveCount = rows.filter(function(r){ return !r.realIsProvisional && !r.incompleteData; }).length;
  return { status: definitiveCount === rows.length ? 'completo' : 'provvisorio', definitiveCount: definitiveCount, totalCount: rows.length };
}

function renderOverviewKpis(totalAll, replicabileAgg, essenzialeAgg, nTrips, realStatus){
  var elimStatus = aggregateStatusLabel(replicabileAgg);
  var elimBlock;
  if (elimStatus === 'nd'){
    elimBlock = '<div class="kpi"><div class="kpi-label">Spese eliminabili totali</div><div class="kpi-value" style="color:var(--text-muted); font-size:19px;">N/D</div><div class="kpi-sub">nessun viaggio ha budget replicabile noto</div></div>';
  } else {
    // Confronta Costo Reale e Budget Replicabile SOLO sugli stessi viaggi noti: non mischia
    // mai un totale "Reale" su tutti i viaggi con un "Replicabile" calcolato su un sottoinsieme.
    var eliminabili = replicabileAgg.realSumForKnown - replicabileAgg.sum;
    var pct = replicabileAgg.realSumForKnown ? eliminabili/replicabileAgg.realSumForKnown : 0;
    var tag = elimStatus !== 'completo' ? ' <span style="font-size:10px; font-weight:700; color:var(--gold-ink);">' + elimStatus.toUpperCase() + '</span>' : '';
    var sub;
    if (elimStatus === 'parziale') sub = 'Parziale — calcolato solo sui ' + replicabileAgg.knownCount + ' viaggi su ' + replicabileAgg.totalCount + ' con budget noto.';
    else if (elimStatus === 'provvisorio') sub = 'Provvisorio — ' + replicabileAgg.definitiveCount + ' viaggi definitivi su ' + replicabileAgg.knownCount + ' con budget noto.';
    else sub = fmtPct(pct) + ' del Costo Reale di quei viaggi';
    elimBlock = '<div class="kpi"><div class="kpi-label">Spese eliminabili totali' + tag + '</div><div class="kpi-value" style="color:var(--rust);">' + fmtEUR(eliminabili) + '</div><div class="kpi-sub">' + sub + '</div></div>';
  }
  var realTag = realStatus.status !== 'completo' ? ' <span style="font-size:10px; font-weight:700; color:var(--gold-ink);">PROVVISORIO</span>' : '';
  var realSub = realStatus.status !== 'completo' ?
    'Provvisorio — ' + realStatus.definitiveCount + ' viaggi definitivi su ' + realStatus.totalCount + ' (contanti da riconciliare o dati storici incompleti sugli altri).' :
    nTrips + ' viaggi, tutti definitivi';
  return (
    '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">' +
      '<div class="kpi paid"><div class="kpi-label">Costo Reale totale' + realTag + '</div><div class="kpi-value">' + fmtEUR(totalAll) + '</div><div class="kpi-sub">' + realSub + '</div></div>' +
      renderAggregateKpiValue('Budget Replicabile totale', replicabileAgg) +
      renderAggregateKpiValue('Budget Essenziale totale', essenzialeAgg) +
    '</div>' +
    '<div class="kpi-grid" style="grid-template-columns:1fr; margin-top:1px;">' + elimBlock + '</div>'
  );
}

/* ============================================================
   CLASSIFICAZIONE MASSIVA: filtra su tutti i viaggi, seleziona, applica in blocco
   ============================================================ */
function getAllExpensesFlat(){
  var out = [];
  state.trips.forEach(function(t){
    (state.expensesByTrip[t.id]||[]).forEach(function(e){ out.push({ e:e, trip:t }); });
  });
  return out;
}
function filteredClassifyRows(){
  var f = state.classifyFilters;
  var descQ = (f.description||'').trim().toLowerCase();
  return getAllExpensesFlat().filter(function(row){
    var catOrig = row.e.categoryOriginal || row.e.category;
    if (f.tripId && row.trip.id !== f.tripId) return false;
    if (f.category && catOrig !== f.category) return false;
    if (f.timing && row.e.timing !== f.timing) return false;
    if (f.nature && row.e.nature !== f.nature) return false;
    if (descQ && row.e.description.toLowerCase().indexOf(descQ) === -1) return false;
    return true;
  });
}
function applyBulkClassification(){
  var b = state.classifyBulk;
  var ids = Object.keys(state.classifySelected).filter(function(id){ return state.classifySelected[id]; });
  if (!ids.length){ showToast('Seleziona almeno una spesa.'); return; }
  var touched = 0;
  getAllExpensesFlat().forEach(function(row){
    if (state.classifySelected[row.e.id] !== true) return;
    var list = state.expensesByTrip[row.trip.id];
    var idx = list.findIndex(function(x){ return x.id === row.e.id; });
    if (idx === -1) return;
    var patch = { _schemaVersion: AppStorage.DATA_SCHEMA_VERSION };
    if (b.nature) patch.nature = b.nature;
    if (b.timing) patch.timing = b.timing;
    // La classificazione in blocco NON tocca MAI categoryOriginal: solo categoryNormalized,
    // usata per statistiche e grafici. La categoria storica resta sempre recuperabile.
    if (b.category) patch.categoryNormalized = b.category;
    if (b.includeInReplicable === 'true') patch.includeInReplicable = true;
    else if (b.includeInReplicable === 'false') patch.includeInReplicable = false;
    else if (b.includeInReplicable === 'auto') patch.includeInReplicable = null;
    var record = Object.assign({}, list[idx], patch);
    list[idx] = record;
    AppStorage.saveExpense(record);
    touched++;
  });
  state.classifySelected = {};
  state.classifyBulk = { nature:'', timing:'', category:'', includeInReplicable:'' };
  showToast(touched + ' spes' + (touched===1?'a aggiornata':'e aggiornate') + '.');
  render();
}

function renderOverview(){
  var rows = tripsOverview();
  if (!rows.length) return renderEmptyState();
  var sorted = sortOverviewRows(rows);
  var sortedByYear = rows.slice().sort(function(a,b){ return a.year-b.year; });

  var totalAll = rows.reduce(function(s,r){ return s+r.real; },0);
  var replicabileAgg = aggregateKnownBudget(rows, 'replicabile', 'replicabileKnown');
  var essenzialeAgg = aggregateKnownBudget(rows, 'essenziale', 'essenzialeKnown');
  var realStatus = realAggregateStatus(rows);
  var kpi = renderOverviewKpis(totalAll, replicabileAgg, essenzialeAgg, rows.length, realStatus);

  var thead = '<tr>' + OVERVIEW_COLUMNS.map(function(c){
    var arrow = state.overviewSort.key===c.key ? (state.overviewSort.dir==='asc'?' ↑':' ↓') : '';
    return '<th style="cursor:pointer; white-space:nowrap;" data-action="sort-overview" data-key="' + c.key + '">' + c.label + arrow + '</th>';
  }).join('') + '<th></th></tr>';

  var tbody = sorted.map(function(r){
    var completenessTag = r.completeness && r.completeness !== 'completo' ?
      ' <span class="tag-disc" style="color:#6B5017; background:#FBF0D9;">' + completenessLabel(r.completeness).toUpperCase() + '</span>' : '';
    return (
      '<tr>' +
        '<td><b>' + r.year + '</b></td>' +
        '<td>' + escapeHtml(r.name) + completenessTag + '</td>' +
        '<td>' + (r.duration ? r.duration.days : 'N/D') + '</td>' +
        '<td>' + r.people + '</td>' +
        '<td class="num">' + fmtEUR(r.real) + '</td>' +
        '<td class="num">' + (r.replicabileKnown ? fmtEUR(r.replicabile) : 'N/D') + '</td>' +
        '<td class="num">' + (r.essenzialeKnown ? fmtEUR(r.essenziale) : 'N/D') + '</td>' +
        '<td class="num">' + fmtEUR(r.realPerPerson) + '</td>' +
        '<td class="num">' + (r.realPerPersonPerDay!=null ? fmtEUR(r.realPerPersonPerDay) : 'N/D') + '</td>' +
        '<td class="num">' + (r.replicabilePerPersonPerDay!=null ? fmtEUR(r.replicabilePerPersonPerDay) : 'N/D') + '</td>' +
        '<td class="num">' + (r.replicabileKnown ? fmtPct(r.pctExtra) : 'N/D') + '</td>' +
        '<td class="num">' + fmtPct(r.pctCibo) + '</td>' +
        '<td class="num">' + fmtPct(r.pctAlloggio) + '</td>' +
        '<td class="num">' + fmtPct(r.pctVoli) + '</td>' +
        '<td><button class="btn btn-ghost btn-sm" data-action="select-trip" data-id="' + r.id + '">Apri →</button></td>' +
      '</tr>'
    );
  }).join('');

  var trendChart = buildMultiLineSVG([
    { label:'Costo Reale', color:'#B98A2E', values: sortedByYear.map(function(r){ return r.real; }),
      provisional: sortedByYear.map(function(r){ return r.realIsProvisional || r.incompleteData; }) },
    { label:'Budget Replicabile', color:'#2F6B67', values: sortedByYear.map(function(r){ return r.replicabileKnown ? r.replicabile : null; }), dash:'5,4',
      provisional: sortedByYear.map(function(r){ return r.replicabileKnown && (r.isProvisional || r.incompleteData); }) },
    { label:'Budget Essenziale', color:'#9C4A34', values: sortedByYear.map(function(r){ return r.essenzialeKnown ? r.essenziale : null; }), dash:'2,3',
      provisional: sortedByYear.map(function(r){ return r.essenzialeKnown && (r.isProvisional || r.incompleteData); }) }
  ], sortedByYear.map(function(r){ return r.year; }));

  // Il confronto €/persona/giorno usa PRIORITARIAMENTE solo viaggi con date confermate e dati
  // storici completi: mescolare una data certa con una dedotta (o un costo parziale) darebbe
  // un confronto fuorviante. "Confermato" richiede contemporaneamente: date confermate, dati
  // completi, e nessun contante ancora da riconciliare (realIsProvisional=false) — un viaggio
  // con contanti da riconciliare finisce tra i provvisori anche se le date sono confermate. I viaggi provvisori restano visibili ma graficamente distinti
  // (barra tratteggiata) e chiaramente etichettati, mai presentati come certi.
  var perDayConfirmed = sortedByYear.filter(function(r){ return r.realPerPersonPerDay != null && !r.datesProvisional && !r.incompleteData && !r.realIsProvisional; })
    .map(function(r){ return { label: r.year + ' · ' + r.name, value: r.realPerPersonPerDay, color:'#4A6FA5', provisional:false }; });
  var perDayProvisional = sortedByYear.filter(function(r){ return r.realPerPersonPerDay != null && (r.datesProvisional || r.incompleteData || r.realIsProvisional); })
    .map(function(r){ return { label: r.year + ' · ' + r.name, value: r.realPerPersonPerDay, color:'#4A6FA5', provisional:true }; });
  var perDayChart;
  if (!perDayConfirmed.length && !perDayProvisional.length){
    perDayChart = '<p class="card-sub">Nessun viaggio ha ancora date di partenza/ritorno impostate: aggiungile in Impostazioni per vedere questo confronto.</p>';
  } else {
    perDayChart = perDayConfirmed.length ? buildBarCompareSVG(perDayConfirmed) :
      '<p class="card-sub">Nessun viaggio ha ancora date confermate: il confronto principale è vuoto per non presentare dati provvisori come certi.</p>';
    if (perDayProvisional.length){
      perDayChart += '<p class="card-sub" style="margin-top:12px;">Viaggi con date suggerite dai movimenti (da confermare) o dati storici incompleti — <b>confronto provvisorio</b>, esclusi sopra:</p>' + buildBarCompareSVG(perDayProvisional);
    }
  }

  return (
    '<h2 style="font-family:var(--font-display); font-size:24px; margin:0 0 2px;">Panoramica generale</h2>' +
    '<p class="card-sub" style="margin:0 0 14px;">Tutti i viaggi registrati, messi a confronto</p>' +
    kpi +
    '<div class="card"><h2>Andamento storico</h2><p class="card-sub">Costo Reale, Budget Replicabile e Budget Essenziale negli anni</p>' + trendChart + '</div>' +
    '<div class="card"><h2>Costo per persona al giorno</h2><p class="card-sub">Il confronto più corretto tra viaggi di durata diversa</p>' + perDayChart + '</div>' +
    '<div class="card"><h2>Tutti i viaggi</h2><div class="table-wrap"><table class="overview-table"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div></div>'
  );
}

/* ============================================================
   RENDER MASTER
   ============================================================ */
function render(){
  var app = document.getElementById('app');
  if (state.loading){
    app.innerHTML = '<div class="boot-loading"><div class="boot-mark">V·S</div><div class="boot-text">Apertura del diario di viaggio…</div></div>';
    return;
  }
  var body;
  if (!state.trips.length){
    body = renderEmptyState();
  } else if (state.view === 'overview'){
    body = renderOverview();
  } else if (state.view === 'classify'){
    body = renderClassifyView();
  } else {
    body = renderTripView();
  }
  app.innerHTML =
    '<div class="shell">' +
      renderHeader() +
      '<div class="main">' + renderStorageWarning() + body + '</div>' +
      '<div class="footnote">Funziona interamente offline, nel tuo browser: nessun account, nessun server. Ricorda di esportare un backup ogni tanto.</div>' +
    '</div>' +
    renderTripModal() +
    renderBackupModal() +
    (state.toast ? '<div class="toast show" id="toast"><span class="dot"></span>' + escapeHtml(state.toast) + '</div>' : '');
}

/* ============================================================
   EVENTI
   ============================================================ */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');
  var id = el.getAttribute('data-id');
  if (action === 'close-modal-bg' && el !== e.target) return;

  if (action === 'select-trip'){ state.currentTripId = id; state.view='trip'; state.tripTab='dashboard'; state.editingExpenseId=null; state.tableCategoryFilter=''; state.tableNatureFilter=''; render(); }
  else if (action === 'view-overview'){ state.view='overview'; render(); }
  else if (action === 'select-trip-tab'){ state.tripTab = el.getAttribute('data-tab'); render(); }
  else if (action === 'open-new-trip'){ state.showTripModal=true; state.tripModalMode='new'; state.editingTripId=null; render(); }
  else if (action === 'open-edit-trip'){ state.showTripModal=true; state.tripModalMode='edit'; state.editingTripId=id; render(); }
  else if (action === 'open-backup-modal'){ state.showBackupModal=true; render(); }
  else if (action === 'close-modal' || action === 'close-modal-bg'){ state.showTripModal=false; state.showBackupModal=false; render(); }
  else if (action === 'export-backup'){ doExportBackup(); }
  else if (action === 'export-all-csv'){ doExportAllCSV(); }
  else if (action === 'delete-trip'){ deleteTrip(id); }
  else if (action === 'import-seed'){ importSeedData(); render(); }
  else if (action === 'edit-expense'){
    state.editingExpenseId = id; state.tripTab = 'spese'; render();
    var formEl = document.getElementById('expenseForm');
    if (formEl && typeof formEl.scrollIntoView === 'function') formEl.scrollIntoView({behavior:'smooth', block:'center'});
  }
  else if (action === 'cancel-edit-expense'){ state.editingExpenseId = null; render(); }
  else if (action === 'delete-expense'){
    if (confirm('Eliminare questa spesa?')) deleteExpense(state.currentTripId, id);
  }
  else if (action === 'filter-non-classified'){ state.tripTab='spese'; state.tableNatureFilter='da-classificare'; state.tableCategoryFilter=''; render(); }
  else if (action === 'export-csv'){
    var trip = state.trips.find(function(t){ return t.id===state.currentTripId; });
    if (trip){
      var csv = expensesToCSV(state.expensesByTrip[trip.id] || []);
      downloadTextFile('Spese_' + trip.year + '_' + trip.name.replace(/[^a-z0-9]+/gi,'_') + '.csv', csv, 'text/csv;charset=utf-8');
    }
  }
  else if (action === 'copy-receipt'){
    var pre = document.getElementById('receiptText');
    var text = pre ? pre.textContent : '';
    copyToClipboard(text);
    showToast('Riepilogo copiato negli appunti');
  }
  else if (action === 'sort-overview'){
    var key = el.getAttribute('data-key');
    if (state.overviewSort.key === key) state.overviewSort.dir = state.overviewSort.dir === 'asc' ? 'desc' : 'asc';
    else state.overviewSort = { key:key, dir: (key==='name') ? 'asc' : 'desc' };
    render();
  }
  else if (action === 'reconcile-cash'){
    reconcileCash(state.currentTripId, id, el.getAttribute('data-resolution'));
  }
  else if (action === 'open-bulk-classify'){
    state.view = 'classify'; state.classifySelected = {}; render();
  }
  else if (action === 'classify-select-all'){
    var visibleRows = filteredClassifyRows();
    var allSelected = visibleRows.length > 0 && visibleRows.every(function(r){ return state.classifySelected[r.e.id]; });
    if (allSelected){ state.classifySelected = {}; }
    else { visibleRows.forEach(function(r){ state.classifySelected[r.e.id] = true; }); }
    render();
  }
  else if (action === 'apply-bulk-classify'){ applyBulkClassification(); }
});

document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'categorySelect'){
    var show = e.target.value === '__custom__';
    var field = document.getElementById('customCategoryField');
    if (field) field.style.display = show ? '' : 'none';
  }
  if (e.target && e.target.id === 'categoryFilter'){ state.tableCategoryFilter = e.target.value; render(); }
  if (e.target && e.target.id === 'natureFilter'){ state.tableNatureFilter = e.target.value; render(); }
  if (e.target && e.target.name === 'importMode'){ state.importMode = e.target.value; }
  if (e.target && e.target.id === 'backupFileInput' && e.target.files && e.target.files[0]){
    handleImportFile(e.target.files[0]);
  }
  if (e.target && e.target.id === 'clFilterTrip'){ state.classifyFilters.tripId = e.target.value; render(); }
  if (e.target && e.target.id === 'clFilterCategory'){ state.classifyFilters.category = e.target.value; render(); }
  if (e.target && e.target.id === 'clFilterTiming'){ state.classifyFilters.timing = e.target.value; render(); }
  if (e.target && e.target.id === 'clFilterNature'){ state.classifyFilters.nature = e.target.value; render(); }
  if (e.target && e.target.id === 'clBulkNature'){ state.classifyBulk.nature = e.target.value; }
  if (e.target && e.target.id === 'clBulkTiming'){ state.classifyBulk.timing = e.target.value; }
  if (e.target && e.target.id === 'clBulkCategory'){ state.classifyBulk.category = e.target.value; }
  if (e.target && e.target.id === 'clBulkReplicable'){ state.classifyBulk.includeInReplicable = e.target.value; }
  if (e.target && e.target.classList && e.target.classList.contains('classify-check')){
    var cid = e.target.getAttribute('data-id');
    if (e.target.checked) state.classifySelected[cid] = true; else delete state.classifySelected[cid];
    // aggiorna solo il contatore senza un re-render completo, per non perdere il focus mentre si spuntano più righe
    var counter = document.getElementById('classifySelectedCount');
    if (counter) counter.textContent = Object.keys(state.classifySelected).filter(function(k){ return state.classifySelected[k]; }).length;
  }
});
var classifyDescDebounce = null;
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'clFilterDesc'){
    var val = e.target.value;
    var cursorPos = e.target.selectionStart;
    clearTimeout(classifyDescDebounce);
    classifyDescDebounce = setTimeout(function(){
      state.classifyFilters.description = val;
      render();
      var el = document.getElementById('clFilterDesc');
      if (el){ el.focus(); try{ el.setSelectionRange(cursorPos, cursorPos); }catch(e){} }
    }, 250);
  }
});

document.addEventListener('submit', function(e){
  if (e.target && e.target.id === 'expenseForm'){
    e.preventDefault();
    var f = e.target;
    var fd = new FormData(f);
    var isEditing = !!state.editingExpenseId;
    var plannedRaw = fd.get('plannedAmount');
    var amountRaw = fd.get('amount');
    var replicableRaw = fd.get('includeInReplicable');
    var hasPlanned = plannedRaw !== '' && plannedRaw != null;
    var hasAmount = amountRaw !== '' && amountRaw != null;
    var data = {
      description: (fd.get('description')||'').trim(),
      timing: fd.get('timing'),
      nature: fd.get('nature'),
      movementType: fd.get('movementType'),
      includeInReplicable: replicableRaw === 'true' ? true : (replicableRaw === 'false' ? false : null),
      // Importo Effettivo è opzionale SE esiste un Importo Previsto: permette di salvare voci
      // "solo a preventivo" (es. prima di partire) senza dover inventare uno zero.
      amount: hasAmount ? round2(parseFloat(amountRaw)) : null,
      plannedAmount: hasPlanned ? round2(parseFloat(plannedRaw)) : null,
      date: fd.get('date') || '',
      destination: (fd.get('destination')||'').trim(),
      note: (fd.get('note')||'').trim()
    };
    if (isEditing){
      // Il form NON include un campo "category" in modifica: categoryOriginal non viene mai
      // toccata qui, resta quella già salvata. Solo categoryNormalized è editabile a parte.
      data.categoryNormalized = fd.get('categoryNormalized');
    } else {
      var category = fd.get('category');
      if (category === '__custom__') category = (fd.get('customCategory')||'').trim() || 'Altro';
      data.categoryOriginal = category;
      data.categoryNormalized = AppStorage.normalizeCategory(category);
    }
    if (!data.description || (!hasAmount && !hasPlanned)){
      showToast('Servono una descrizione e almeno un importo (previsto o effettivo).');
      return;
    }
    addOrUpdateExpense(f.getAttribute('data-trip'), data);
  }
  if (e.target && e.target.id === 'tripForm'){
    e.preventDefault();
    var fd2 = new FormData(e.target);
    var data2 = {
      name: (fd2.get('name')||'').trim() || 'Viaggio senza nome',
      year: parseInt(fd2.get('year'),10) || new Date().getFullYear(),
      people: Math.max(1, parseInt(fd2.get('people'),10) || 1),
      startDate: fd2.get('startDate') || null,
      endDate: fd2.get('endDate') || null,
      countries: (fd2.get('countries')||'').trim(),
      completeness: fd2.get('completeness') || 'non-specificata',
      notes: (fd2.get('notes')||'').trim()
    };
    createOrUpdateTrip(data2);
  }
});

function copyToClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

loadAll();

})();
